{% extends 'base.html' %}

{% block content %}
<h2>Deposit Money</h2>
<form method="post">
    {% csrf_token %}
    <div>
        <label>Amount:</label>
        <input type="number" name="amount" step="0.01" min="0.01" required>
    </div>
    <button type="submit">Deposit</button>
</form>
<a href="{% url 'wallet' %}">Back to Wallet</a>
{% endblock %}
