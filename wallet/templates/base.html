<!DOCTYPE html>
<html>
<head>
    <title>Digital Wallet</title>
</head>
<style>
    form div {
        margin-bottom: 10px;
    }
    label {
        display: inline-block;
        width: 120px;
    }
    select, input[type="date"] {
        padding: 5px;
        width: 200px;
    }
    button {
        padding: 5px 15px;
        margin-right: 10px;
    }
    ul {
        list-style-type: none;
        padding-left: 0;
    }
    li {
        padding: 10px;
        margin-bottom: 10px;
        background: #f5f5f5;
        border-radius: 4px;
    }
</style>
<body>
    {% if messages %}
        {% for message in messages %}
            <div>{{ message }}</div>
        {% endfor %}
    {% endif %}
    
    {% block content %}{% endblock %}
</body>
</html>
