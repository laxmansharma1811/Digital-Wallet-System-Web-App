{% extends 'base.html' %}

{% block content %}
<h2>Pending KYC Verifications</h2>

<table class="table">
    <thead>
        <tr>
            <th>User</th>
            <th>Document Type</th>
            <th>Submitted At</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for kyc in pending_kycs %}
        <tr>
            <td>{{ kyc.user.email }}</td>
            <td>{{ kyc.document_type|title }}</td>
            <td>{{ kyc.submitted_at }}</td>
            <td>
                <a href="{% url 'kyc_review_detail' kyc.id %}" class="btn btn-sm btn-info">Review</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No pending KYC verifications</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
